<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>吴雪凡 | 文字 摄影 影像</title>
    <meta
      name="description"
      content="吴雪凡的个人网站，长期收录文字、摄影作品与剪辑视频。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#latest">跳到内容</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand-mark">雪</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html" data-nav-link>首页</a>
        <a href="photography.html" data-nav-link>摄影</a>
        <a href="writing.html" data-nav-link>文字</a>
        <a href="video.html" data-nav-link>视频</a>
        <a href="about.html" data-nav-link>关于</a>
        <a href="archive.html" data-nav-link>归档</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero hero-minimal" aria-label="首页">
        <div class="hero-media" aria-hidden="true">
          <div class="hero-frame hero-frame-a"></div>
          <div class="hero-frame hero-frame-b"></div>
          <div class="hero-frame hero-frame-c"></div>
        </div>
        <div class="hero-copy">
          <p class="eyebrow">Personal Archive</p>
          <p id="siteIntro">
            这里会长期收录我的文字、摄影作品和剪辑视频。更新不追赶噪音，只保留真正想留下的片段。
          </p>
          <div class="hero-actions">
            <a class="button primary" href="#latest">查看最新</a>
            <a class="button secondary" href="photography.html">进入摄影</a>
          </div>
        </div>
      </section>

      <section class="section latest" id="latest" aria-labelledby="latest-title">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Latest</p>
            <h2 id="latest-title">最新更新</h2>
          </div>
          <p class="section-note" id="latestNote"></p>
        </div>
        <div class="latest-grid" id="latestGrid"></div>
      </section>

      <section class="section exhibition" id="photography" aria-labelledby="photo-title">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Photography</p>
            <h2 id="photo-title">摄影展厅</h2>
          </div>
          <div>
            <p class="section-note" id="photoShowcaseNote"></p>
            <a class="text-link" href="photography.html">查看全部摄影</a>
          </div>
        </div>
        <div class="photo-showcase" id="photoShowcase" aria-label="摄影主题"></div>
      </section>

      <section class="section split" id="about" aria-labelledby="about-title">
        <div>
          <p class="eyebrow">About</p>
          <h2 id="about-title">关于这个网站</h2>
        </div>
        <div class="about-copy">
          <p id="aboutText">
            这是一个个人作品与日常观察的长期档案。文字记录想法，照片保存现场，视频整理时间里的运动。
          </p>
          <dl class="facts" id="factsList"></dl>
          <a class="button secondary inline-button" href="about.html">继续阅读</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> <span id="footerName">吴雪凡</span></p>
      <a href="#top">回到顶部</a>
    </footer>

    <div class="modal" id="mediaModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button class="modal-close" type="button" aria-label="关闭" data-close-modal>
          ×
        </button>
        <div class="modal-media" id="modalMedia"></div>
        <div class="modal-copy">
          <p class="meta" id="modalMeta"></p>
          <h3 id="modalTitle"></h3>
          <p id="modalDescription"></p>
          <a class="text-link" id="modalLink" href="#" target="_blank" rel="noreferrer">
            打开原链接
          </a>
        </div>
      </div>
    </div>

    <script src="content/site-content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
